[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "learnMSA"
dynamic = ["version"]
description = "learnMSA: Learning and Aligning large Protein Families"
license-files = ["LICENSE.md"]
authors = [{ name = "Felix Becker", email = "beckerfelix94@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
# Framework-free core. Install a backend extra to actually run learnMSA:
#   pip install learnMSA[tensorflow]   or   pip install learnMSA[pytorch]
dependencies = [
    "biopython>=1.69",
    "pyfamsa",
    "numpy",
    "pydantic",
    "pandas",
    "hidten",
    "evoten",
]

[project.optional-dependencies]
tensorflow = [
    "tensorflow[and-cuda]>=2.17,<2.21",
    "hidten[tensorflow]",
    "evoten[tensorflow]",
]
# NOTE: hidten spells this extra "pytorch" while evoten spells it "torch".
pytorch = [
    "torch>=2.13",
    "hidten[pytorch]",
    "evoten[torch]",
]
test = ["pytest"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
]
plots = [
    "evoten[plots]",
    "imageio",
    "logomaker",
    "networkx",
    "scipy"
]
plm-tf = [
    # NOTE: on systems with custom CUDA/NCCL installs (e.g. Blackwell),
    # install torch manually first:
    # pip install torch --index-url https://download.pytorch.org/whl/cpu
    # torch is listed only because HuggingFace transformers wants it importable;
    # the language model code itself uses the TensorFlow API (TFEsmModel,
    # TFT5EncoderModel) and never calls torch. It is therefore left unpinned, so
    # that `pip install learnMSA[pytorch,plm]` stays satisfiable alongside the
    # `pytorch` extra's torch>=2.13.
    "torch",
    "transformers<5.0",
    "tf-keras",
    "SentencePiece"
]
plm-torch = [
    "transformers<5.0",
    "SentencePiece"
]

[project.urls]
Homepage = "https://github.com/Gaius-Augustus/learnMSA"

[project.scripts]
learnMSA = "learnMSA.run:run_main"
learnMSA_embed = "learnMSA.run.precompute_embeddings:main"

[tool.setuptools.dynamic]
version = { attr = "learnMSA._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["learnMSA*"]
exclude = ["learnMSA.legacy*"]

[tool.setuptools.package-data]
learnMSA = [
    "docs/*",
    "hmm/weights/*",
    "protein_language_models/scoring_models/*",
]

[tool.setuptools]
include-package-data = false
